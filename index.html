    <script>
      // Initialize React Fast Refresh preamble stubs so modules don't fail when HMR is inactive or evaluated in sandbox
      window.$RefreshReg$ = window.$RefreshReg$ || function() {};
      window.$RefreshSig$ = window.$RefreshSig$ || function() { return function(type) { return type; }; };
      window.__vite_plugin_react_preamble_installed__ = true;

      // Suppress benign Vite WebSocket disconnection and HMR client console logs in sandboxed environment
      (function() {
        function isViteBenignMsg(arg) {
          if (!arg) return false;
          if (typeof arg === 'string') {
            return (
              arg === '[vite]' ||
              arg.indexOf('[vite]') !== -1 ||
              arg.indexOf('vite:') !== -1 ||
              arg.indexOf('failed to connect to websocket') !== -1 ||
              arg.indexOf('server connection lost') !== -1 ||
              arg.indexOf("can't detect preamble") !== -1
            );
          }
          if (typeof arg === 'object') {
            var str = (arg.message || '') + ' ' + (arg.stack || '') + ' ' + (arg.name || '');
            return (
              str.indexOf('[vite]') !== -1 ||
              str.indexOf('failed to connect to websocket') !== -1 ||
              str.indexOf("can't detect preamble") !== -1
            );
          }
          return false;
        }

        function shouldFilter(args) {
          for (var i = 0; i < args.length; i++) {
            if (isViteBenignMsg(args[i])) return true;
          }
          return false;
        }

        var _origError = console.error;
        console.error = function() {
          if (shouldFilter(arguments)) return;
          _origError.apply(console, arguments);
        };

        var _origWarn = console.warn;
        console.warn = function() {
          if (shouldFilter(arguments)) return;
          _origWarn.apply(console, arguments);
        };

        window.addEventListener('error', function(e) {
          if (
            isViteBenignMsg(e.message) ||
            (e.filename && e.filename.indexOf('@vite/client') !== -1) ||
            (e.error && isViteBenignMsg(e.error))
          ) {
            e.preventDefault();
            e.stopPropagation();
            return false;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          if (isViteBenignMsg(e.reason)) {
            e.preventDefault();
            e.stopPropagation();
            return false;
          }
        }, true);
      })();
    </script>
